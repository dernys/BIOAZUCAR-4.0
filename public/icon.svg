<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="caneGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Background Squircle with Safe Zone -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Industrial Cogwheel Outer Teeth -->
  <g transform="translate(256, 256)" stroke="#0ea5e9" stroke-width="6" fill="none" opacity="0.35">
    <circle r="160" stroke-dasharray="14 18" stroke-width="12"/>
    <circle r="130" stroke="#334155" stroke-width="3" stroke-dasharray="6 8"/>
  </g>

  <!-- Sugar Cane Stalk (Left / Center) -->
  <g id="sugarCane">
    <!-- Segment 1 -->
    <path d="M 210 400 L 210 320 Q 230 316 250 320 L 250 400 Z" fill="url(#caneGrad)"/>
    <line x1="205" y1="320" x2="255" y2="320" stroke="#059669" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Segment 2 -->
    <path d="M 212 316 L 214 230 Q 234 226 252 230 L 248 316 Z" fill="url(#caneGrad)"/>
    <line x1="208" y1="228" x2="258" y2="228" stroke="#059669" stroke-width="6" stroke-linecap="round"/>

    <!-- Segment 3 -->
    <path d="M 216 226 L 220 140 Q 236 136 254 140 L 250 226 Z" fill="url(#caneGrad)"/>
    <line x1="212" y1="138" x2="260" y2="138" stroke="#059669" stroke-width="6" stroke-linecap="round"/>

    <!-- Leaf curve left -->
    <path d="M 212 228 C 150 220 110 170 100 120 C 120 150 160 180 216 195 Z" fill="#10b981" opacity="0.9"/>
    
    <!-- Leaf curve right -->
    <path d="M 252 228 C 300 210 340 160 350 110 C 330 140 290 170 248 190 Z" fill="#34d399" opacity="0.85"/>

    <!-- Top Sprout -->
    <path d="M 235 138 C 225 90 200 60 170 50 C 205 70 230 100 235 138 Z" fill="#6ee7b7"/>
    <path d="M 240 138 C 255 90 280 60 310 50 C 275 70 250 100 240 138 Z" fill="#a7f3d0"/>
  </g>

  <!-- Digital Twin / Telemetry Rings (Right Side) -->
  <g transform="translate(256, 256)">
    <!-- Circuit nodes & pulse tracks -->
    <path d="M 40 -60 L 100 -60 L 130 -30 L 130 50 L 80 100" fill="none" stroke="url(#techGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <circle cx="100" cy="-60" r="8" fill="#38bdf8"/>
    <circle cx="130" cy="-30" r="10" fill="#0284c7" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="130" cy="50" r="8" fill="#38bdf8"/>
    <circle cx="80" cy="100" r="12" fill="url(#amberGrad)" stroke="#fef08a" stroke-width="3"/>

    <!-- Data Bus Dots -->
    <circle cx="-30" cy="80" r="6" fill="#10b981"/>
    <circle cx="0" cy="110" r="7" fill="#34d399"/>
    <circle cx="40" cy="120" r="5" fill="#38bdf8"/>
  </g>

  <!-- Bottom Brand Acronym Badge -->
  <g transform="translate(256, 440)">
    <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="0" y="7" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" letter-spacing="4" text-anchor="middle">4.0</text>
    <circle cx="-60" cy="0" r="4" fill="#10b981"/>
    <circle cx="60" cy="0" r="4" fill="#38bdf8"/>
  </g>
</svg>
