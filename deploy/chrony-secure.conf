# ==============================================================================
# BIOAZÚCAR 4.0 — CHRONY SECURE INDUSTRIAL NTP/NTS CONFIGURATION (IEC 62443 FR3)
# ==============================================================================
# Target: /etc/chrony/chrony.conf
# Provides sub-millisecond tamper-proof time synchronization for OT telemetry
# ==============================================================================

# 1. Primary NTS (Network Time Security) Authenticated Servers
server time.cloudflare.com iburst nts
server nts.ntp.se iburst nts

# 2. Local Plant Boundary Master Clock / GPS PTP Grandmaster Fallback
server 192.168.10.1 iburst minpoll 4 maxpoll 6 prefer

# 3. Allow stepping clock on startup if offset > 1 sec, but slew thereafter
makestep 1.0 3

# 4. Drift file
driftfile /var/lib/chrony/chrony.drift

# 5. Log telemetry adjustments for auditor tracking
logdir /var/log/chrony
log measurements statistics tracking

# 6. Hardware timestamping on OT NIC for sub-millisecond precision
hwtimestamp eth0

# 7. Restrict remote management
cmdport 0
