# BioAzúcar 4.0 — Industrial MQTT Broker Configuration (IEC 62443 Level 2/3)
listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
