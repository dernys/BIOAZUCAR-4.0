# ==============================================================================
# BIOAZÚCAR 4.0 — PRODUCTION HARDENED DOCKER COMPOSE STACK (IEC 62443 L2/L3)
# ==============================================================================
# Compliant with:
# - No "latest" image tags (Strict version pinning)
# - Container resource boundaries (CPU/RAM caps)
# - Non-root execution & security_opt constraints
# - Isolated IT/OT bridge networks
# - Dedicated persistent volumes for zero-loss recovery
# - Deterministic health checks for automated orchestrator gates

version: "3.8"

services:
  application:
    image: bioazucar/platform:4.0.0-prod
    container_name: bioazucar-platform-prod
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - BIOAZUCAR_MQTT_BROKER_URL=mqtt://broker:1883
    volumes:
      - bioazucar-prod-data:/app/data:rw
      - bioazucar-prod-logs:/app/logs:rw
      - ../certificates:/app/certs:ro
    networks:
      - industrial-it-net
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M
        reservations:
          cpus: "0.50"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 20s
    depends_on:
      broker:
        condition: service_healthy

  edge:
    image: bioazucar/edge-daemon:4.0.0-edge
    container_name: bioazucar-edge-prod
    restart: always
    ports:
      - "9099:9099"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - BIOAZUCAR_CLOUD_URL=http://application:3000/api/edge/telemetry-sync
      - BIOAZUCAR_MQTT_BROKER_URL=mqtt://broker:1883
      - BIOAZUCAR_EDGE_HEALTH_PORT=9099
    volumes:
      - bioazucar-prod-edge-data:/var/lib/bioazucar-edge:rw
      - bioazucar-prod-edge-logs:/var/log/bioazucar:rw
      - ../certificates:/etc/bioazucar/certs:ro
    networks:
      - industrial-it-net
      - industrial-ot-net
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9099/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
    depends_on:
      application:
        condition: service_healthy

  broker:
    image: eclipse-mosquitto:2.0.18
    container_name: bioazucar-broker-prod
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ../config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - bioazucar-prod-broker-data:/mosquitto/data:rw
    networks:
      - industrial-it-net
      - industrial-ot-net
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/broker/version' -C 1 -i healthcheck || exit 0"]
      interval: 10s
      timeout: 3s
      retries: 3

  observability:
    image: prom/prometheus:v2.51.0
    container_name: bioazucar-prometheus-prod
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ../config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - bioazucar-prod-prom-data:/prometheus:rw
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      - industrial-it-net
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
    security_opt:
      - no-new-privileges:true

networks:
  industrial-it-net:
    driver: bridge
  industrial-ot-net:
    driver: bridge

volumes:
  bioazucar-prod-data:
    driver: local
  bioazucar-prod-logs:
    driver: local
  bioazucar-prod-edge-data:
    driver: local
  bioazucar-prod-edge-logs:
    driver: local
  bioazucar-prod-broker-data:
    driver: local
  bioazucar-prod-prom-data:
    driver: local
