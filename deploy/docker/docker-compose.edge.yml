# ==============================================================================
# BIOAZÚCAR 4.0 — STANDALONE EDGE DAEMON STACK (INDUSTRIAL PC IPC)
# ==============================================================================
version: "3.8"

services:
  bioazucar-edge:
    image: bioazucar/edge-daemon:4.0.0-edge
    container_name: bioazucar-edge-node
    restart: always
    network_mode: "host"
    env_file:
      - /etc/bioazucar/edge.env
    environment:
      - NODE_ENV=production
      - BIOAZUCAR_SAF_JOURNAL_PATH=/var/lib/bioazucar-edge/saf-journal.json
      - BIOAZUCAR_EDGE_HEALTH_PORT=9099
      - BIOAZUCAR_TLS_CA_CERT=/etc/bioazucar/certs/plant-ca.crt
      - BIOAZUCAR_TLS_CLIENT_CERT=/etc/bioazucar/certs/edge-client.crt
      - BIOAZUCAR_TLS_CLIENT_KEY=/etc/bioazucar/certs/edge-client.key
      - BIOAZUCAR_TLS_INSECURE=false
    volumes:
      - /var/lib/bioazucar-edge:/var/lib/bioazucar-edge:rw
      - /var/log/bioazucar:/var/log/bioazucar:rw
      - /etc/bioazucar/certs:/etc/bioazucar/certs:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9099/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
