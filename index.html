    <script>
      // Fast Refresh / React preamble fallback ensuring window.$RefreshReg$ is defined
      // before any component module executes.
      window.$RefreshReg$ = window.$RefreshReg$ || function() {};
      window.$RefreshSig$ = window.$RefreshSig$ || function() { return function(type) { return type; }; };
      window.__vite_plugin_react_preamble_installed__ = true;

      // Defensive isolation strictly for unauthorized third-party browser extensions
      // (e.g. injected wallet extensions) to prevent untrusted scripts from disrupting industrial HMI.
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = typeof reason === 'string' ? reason : (reason && (reason.message || reason.stack)) || '';
        if (
          msg.includes('chrome-extension://') ||
          msg.includes('moz-extension://') ||
          msg.includes('safari-extension://') ||
          msg.includes('extension context invalidated')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
