    <script>
      // Defensive handler: prevent external browser extensions (e.g. MetaMask, Web3 providers)
      // from throwing unhandled rejections or polluting window error events in sandboxed iframes
      (function() {
        // Intercept expected benign platform [vite] websocket disconnection logs in AI Studio preview
        var origConsoleError = console.error;
        console.error = function() {
          var firstArg = arguments[0];
          if (typeof firstArg === 'string' && firstArg.indexOf('[vite] failed to connect to websocket') !== -1) {
            console.debug.apply(console, arguments);
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        var isExtensionNoise = function(err) {
          if (!err) return false;
          var msg = typeof err === 'string' ? err : (err.message || err.reason || err.description || '');
          if (typeof msg !== 'string') {
            try { msg = String(msg); } catch (e) { return false; }
          }
          var lower = msg.toLowerCase();
          return (
            lower.includes('metamask') ||
            lower.includes('failed to connect to metamask') ||
            lower.includes('ethereum') ||
            lower.includes('chrome-extension://') ||
            lower.includes('moz-extension://') ||
            lower.includes('safari-extension://') ||
            lower.includes('extension context invalidated')
          );
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (isExtensionNoise(event.reason) || isExtensionNoise(event.reason && event.reason.message)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return false;
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isExtensionNoise(event.message) || isExtensionNoise(event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return false;
          }
        }, true);
      })();
    </script>
