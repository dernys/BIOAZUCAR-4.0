name: BioAzúcar 4.0 CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Lint, Test & Production Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Type Check & Linting (TypeScript)
        run: npm run lint

      - name: Execute Vitest Automated Test Suite
        run: npm test

      - name: Production Bundle & Server Compilation
        run: npm run build

      - name: Verify Industrial Edge Daemon Standalone Build
        run: |
          npx esbuild src/services/edge/daemon.ts \
            --bundle \
            --platform=node \
            --target=node20 \
            --outfile=dist/edge-daemon.cjs
